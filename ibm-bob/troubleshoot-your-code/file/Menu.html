<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f4ef;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #5c3317;
            font-size: 2.5em;
        }

        p.tagline {
            font-style: italic;
            color: #8b5e3c;
            font-size: 1.2em;
        }

        img.cafe-image {
            width: 60%;
            border-radius: 10px;
            margin: 20px 0;
        }

        button {
            background-color: #5c3317;
            color: white;
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #8b5e3c;
        }

        .menu-container .items {
            display: none;
            margin-top: 20px;
            background-color: #fff8f2;
            border: 1px solid #d4a97a;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .menu-container .items ul {
            list-style-type: disc;
            padding-left: 20px;
        }

        .menu-container .items ul li {
            margin: 8px 0;
            color: #3e2010;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <title>Roast Toast Coast Café</title>

    <h1>Welcome to Roast Toast Coast Café</h1>
    <p class="tagline">Where every cup tells a story.</p>

    <img class="cafe-image" scr="images/cafe.jpg">

    <button onclick="toggleMenu()">Our Menu</button>

    <div class="menu-container">
        <div class="menu-list">
            <h3>Our Menu</h3>
            <ul>
                <li>Espresso – $3.50</li>
                <li>Cappuccino – $4.25</li>
                <li>Avocado Toast – $7.00</li>
                <li>Blueberry Muffin – $3.00</li>
                <li>Cold Brew – $4.75</li>
            </ul>
    </div>

    <script>
        function showMenu() {
            var menu = document.querySelector('.menu-items');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }
    </script>

</body>
</html>
